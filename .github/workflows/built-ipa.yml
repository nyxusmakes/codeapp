name: Build Code App

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build Code App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Show project schemes
        run: |
          xcodebuild -list -project Code.xcodeproj

      - name: Build unsigned
        run: |
          xcodebuild \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Code-App-unsigned
          path: build/Build/Products/Release-iphoneos/
          if-no-files-found: error
